<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បញ្ជីភាពយន្ត - Tri-Cinematics</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Cinema Theme CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-netflix sticky-top py-3">
        <div class="container">
            <a class="navbar-brand brand-logo fs-3" href="index.html">Tri-Cinematics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">ទំព័រដើម</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-white" href="movies.html">ភាពយន្ត</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/about.html">អំពីយើង</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4 flex-grow-1">
        <!-- របារចំណងជើង, Search និង Sort -->
        <div class="row align-items-center g-3 mb-4">
            <div class="col-12 col-lg-4">
                <h2 class="fw-bold mb-0">បញ្ជីភាពយន្ត <span style="color: #e50914;">Catalog</span></h2>
            </div>
            
            <!-- ប្រអប់ Live Search -->
            <div class="col-12 col-md-7 col-lg-5">
                <input type="text" id="searchInput" class="form-control form-control-netflix py-2 px-3" 
                       placeholder="ស្វែងរកតាមចំណងជើង ឬសាច់រឿងសង្ខេប...">
            </div>

            <!-- Dropdown តម្រៀប (Sort) -->
            <div class="col-12 col-md-5 col-lg-3">
                <select id="sortSelect" class="form-select form-select-netflix py-2 px-3">
                    <option value="default">តម្រៀប៖ លំនាំដើម</option>
                    <option value="rating-desc">ពិន្ទុ៖ ខ្ពស់ ទៅ ទាប</option>
                    <option value="rating-asc">ពិន្ទុ៖ ទាប ទៅ ខ្ពស់</option>
                    <option value="year-desc">ឆ្នាំផលិត៖ ថ្មី ទៅ ចាស់</option>
                    <option value="year-asc">ឆ្នាំផលិត៖ ចាស់ ទៅ ថ្មី</option>
                </select>
            </div>
        </div>

        <!-- ប៊ូតុងចម្រោះប្រភេទរឿង (Genre Filter) -->
        <div id="genreContainer" class="d-flex flex-wrap gap-2 mb-4 pb-3" style="border-bottom: 1px solid #2a2a2a;">
            <button data-genre="All" class="btn btn-genre active">ទាំងអស់</button>
            <button data-genre="Action" class="btn btn-genre">Action</button>
            <button data-genre="Sci-Fi" class="btn btn-genre">Sci-Fi</button>
            <button data-genre="Drama" class="btn btn-genre">Drama</button>
            <button data-genre="Comedy" class="btn btn-genre">Comedy</button>
            <button data-genre="Horror" class="btn btn-genre">Horror</button>
        </div>

        <!-- បង្ហាញចំនួនលទ្ធផលរកឃើញ -->
        <p id="resultCount" class="small mb-3 text-secondary">បង្ហាញលទ្ធផល៖ 0 រឿង</p>

        <!-- បញ្ជី Movie Grid (Bootstrap 5) -->
        <div id="movieGrid" class="row g-4">
            <!-- កូដ JS នឹងបញ្ចូល Card រឿងនៅទីនេះ -->
        </div>

        <!-- ផ្ទាំងបង្ហាញពេលរកមិនឃើញរឿង (Empty State) -->
        <div id="emptyState" class="text-center py-5 d-none">
            <h5 class="text-white mb-2">រកមិនឃើញភាពយន្តដែលត្រូវនឹងការស្វែងរករបស់អ្នកទេ</h5>
            <p class="small text-secondary">សូមសាកល្បងវាយពាក្យផ្សេង ឬជ្រើសរើសប្រភេទរឿង "ទាំងអស់"</p>
        </div>

        <!-- ប៊ូតុង Pagination (Show More) -->
        <div class="text-center mt-5">
            <button id="showMoreBtn" class="btn btn-netflix px-5 py-2 d-none">
                បង្ហាញបន្ថែម (Show More)
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center small mt-5" style="background-color: #0a0a0a; border-top: 1px solid #2a2a2a;">
        <div class="container">
            <span class="fw-bold" style="color: #e50914;">Tri-Cinematics</span> &copy; 2026. រក្សាសិទ្ធិគ្រប់យ៉ាង។
        </div>
    </footer>

    <!-- Bootstrap 5 JS & Movies Module -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/movies.js"></script>
</body>
</html>
